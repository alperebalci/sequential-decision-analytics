name: SDA policy classes CI

on:
  push:
    paths:
      - 'projects/sequential-decision-analytics-policy-classes/**'
      - '.github/workflows/policy-classes-project.yml'
  pull_request:
    paths:
      - 'projects/sequential-decision-analytics-policy-classes/**'
      - '.github/workflows/policy-classes-project.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: projects/sequential-decision-analytics-policy-classes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: pytest
