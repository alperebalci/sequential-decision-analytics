name: Online OR project CI

on:
  push:
    paths:
      - 'projects/online-or-competitive-analysis/**'
      - '.github/workflows/online-or-project.yml'
  pull_request:
    paths:
      - 'projects/online-or-competitive-analysis/**'
      - '.github/workflows/online-or-project.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/online-or-competitive-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest
